<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f17" />
  <title>Radar Jogos</title>
  <style>
    :root{
      --bg:#0b0f17;
      --panel:#0f1626;
      --card:#111b2f;
      --border:rgba(255,255,255,.08);
      --muted:rgba(255,255,255,.62);
      --text:rgba(255,255,255,.92);
      --chip:#152241;
      --chipOn:#1f3b7a;
      --good:#2ecc71;
      --warn:#f1c40f;
      --bad:#e74c3c;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius:18px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 12px 28px;
    }

    /* TOPBAR */
    .topbar{
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(11,15,23,.96), rgba(11,15,23,.88));
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    .topbarInner{
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 12px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .title{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 0;
      flex:1;
    }
    .title h1{
      margin:0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing:.2px;
    }
    .sub{
      font-size:12px;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .iconBtn{
      width: 40px;
      height: 40px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      display:grid;
      place-items:center;
      box-shadow: var(--shadow);
      cursor:pointer;
      user-select:none;
    }
    .iconBtn:active{transform: translateY(1px);}

    /* MENU (⋯) */
    .menu{
      position: relative;
    }
    .menuPanel{
      position:absolute;
      right:0;
      top: 46px;
      width: 220px;
      background: var(--panel);
      border:1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow:hidden;
      display:none;
    }
    .menuPanel.open{display:block;}
    .menuItem{
      padding: 12px 12px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      cursor:pointer;
      color: var(--text);
      background: transparent;
    }
    .menuItem:last-child{border-bottom:none;}
    .menuItem:hover{background: rgba(255,255,255,.04);}

    /* SEARCH + CHIPS */
    .controls{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .searchRow{
      display:flex;
      gap:10px;
      align-items:center;
    }
    input[type="search"]{
      flex:1;
      height: 44px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      outline:none;
    }
    input[type="search"]::placeholder{color: rgba(255,255,255,.35)}

    .chips{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .chip{
      border: 1px solid var(--border);
      background: var(--chip);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 12px;
      cursor:pointer;
      user-select:none;
    }
    .chip.on{
      background: var(--chipOn);
      border-color: rgba(255,255,255,.14);
    }

    /* LIST */
    .grid{
      margin-top: 14px;
      display:grid;
      gap:12px;
    }
    .card{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .cardHead{
      padding: 12px 12px 10px;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .favBtn{
      width: 36px;
      height: 36px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      flex:0 0 auto;
    }
    .favBtn.on{background: rgba(46,204,113,.12); border-color: rgba(46,204,113,.25);}
    .headMain{min-width:0; flex:1;}
    .teams{
      display:flex;
      gap:8px;
      align-items:center;
      font-weight: 800;
      font-size: 14px;
      line-height: 1.2;
      flex-wrap:wrap;
    }
    .vs{opacity:.5; font-weight:700}
    .meta{
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .badge{
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      color: var(--text);
    }
    .badge.live{border-color: rgba(241,196,15,.28); background: rgba(241,196,15,.10);}
    .badge.ft{border-color: rgba(46,204,113,.25); background: rgba(46,204,113,.10);}
    .badge.soon{border-color: rgba(52,152,219,.25); background: rgba(52,152,219,.10);}

    .score{
      margin-left:auto;
      font-weight: 900;
      font-size: 16px;
      letter-spacing:.3px;
      display:flex;
      gap:6px;
      align-items:center;
      flex:0 0 auto;
    }

    details{
      border-top: 1px solid var(--border);
      background: rgba(0,0,0,.08);
    }
    summary{
      list-style:none;
      cursor:pointer;
      user-select:none;
      padding: 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size: 13px;
      color: var(--text);
    }
    summary::-webkit-details-marker{display:none;}
    .detailsBody{
      padding: 0 12px 12px;
      color: var(--muted);
      font-size: 12px;
      display:grid;
      gap:8px;
    }
    .kv{
      display:flex;
      justify-content:space-between;
      gap:10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.03);
      border-radius: 14px;
      padding: 10px 10px;
    }
    .kv b{color: var(--text); font-weight:700}

    .empty{
      margin-top: 18px;
      padding: 14px;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255,255,255,.02);
    }

    .toast{
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      background: rgba(15,22,38,.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      color: var(--text);
      box-shadow: var(--shadow);
      display:none;
      max-width: 980px;
      margin: 0 auto;
    }
    .toast.show{display:block;}
    .row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-size: 12px;
      color: var(--muted);
    }
    .row b{color: var(--text);}
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbarInner">
      <div class="title">
        <h1>Radar Jogos</h1>
        <div class="sub" id="subline">Carregando…</div>
      </div>

      <button class="iconBtn" id="refreshBtn" title="Atualizar">⟳</button>

      <div class="menu">
        <button class="iconBtn" id="menuBtn" title="Menu">⋯</button>
        <div class="menuPanel" id="menuPanel">
          <div class="menuItem" data-action="favOnly">Favoritos</div>
          <div class="menuItem" data-action="history">Histórico</div>
          <div class="menuItem" data-action="settings">Configurações</div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="controls">
      <div class="searchRow">
        <input id="q" type="search" placeholder="Buscar time, liga…" />
      </div>

      <div class="chips" id="chips">
        <div class="chip on" data-hours="all">Tudo</div>
        <div class="chip" data-hours="1">1h <span class="muted" id="c1"></span></div>
        <div class="chip" data-hours="3">3h <span class="muted" id="c3"></span></div>
        <div class="chip" data-hours="6">6h <span class="muted" id="c6"></span></div>
        <div class="chip" data-hours="12">12h <span class="muted" id="c12"></span></div>
        <div class="chip" data-hours="live">Ao vivo <span class="muted" id="clive"></span></div>
      </div>
    </section>

    <section class="grid" id="grid"></section>

    <div class="empty" id="empty" style="display:none;">
      Nada por aqui com esse filtro. Se você estiver sem cota na API, o app mantém o último snapshot, mas pode ficar desatualizado.
    </div>
  </main>

  <div class="toast" id="toast">
    <div class="row">
      <span id="toastMsg">…</span>
      <b id="toastTime">…</b>
    </div>
  </div>

<script>
(() => {
  const OUT_URL = "jogos.json";   // mesmo nome gerado pelo seu script
  const POLL_MS = 60_000;         // revalida snapshot do JSON a cada 60s
  const LIVE_TICK_MS = 15_000;    // “minuto” anda localmente (mais suave)

  // Estado
  let RAW = [];
  let view = [];
  let filterMode = "all"; // all | 1 | 3 | 6 | 12 | live
  let q = "";
  let favOnly = false;

  const $ = (id) => document.getElementById(id);

  const subline = $("subline");
  const grid = $("grid");
  const empty = $("empty");
  const refreshBtn = $("refreshBtn");
  const menuBtn = $("menuBtn");
  const menuPanel = $("menuPanel");
  const chips = $("chips");
  const toast = $("toast");
  const toastMsg = $("toastMsg");
  const toastTime = $("toastTime");

  const LS_FAV = "radar_favs_v1";
  const LS_HIST = "radar_hist_v1";
  const LS_CFG  = "radar_cfg_v1";

  const favs = new Set(JSON.parse(localStorage.getItem(LS_FAV) || "[]"));
  const hist = JSON.parse(localStorage.getItem(LS_HIST) || "[]");
  const cfg  = JSON.parse(localStorage.getItem(LS_CFG) || "{}");

  // util
  const nowMs = () => Date.now();
  const fmtTime = (ms) => {
    const d = new Date(ms);
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `${hh}:${mm}`;
  };
  const fmtDate = (ms) => {
    const d = new Date(ms);
    return d.toLocaleDateString("pt-BR", {weekday:"short", day:"2-digit", month:"2-digit"});
  };

  // Mostra toast
  function showToast(msg){
    toastMsg.textContent = msg;
    toastTime.textContent = new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>toast.classList.remove("show"), 2500);
  }

  // Interpreta status ao vivo / futuro / FT
  function isLive(g){
    const s = (g?.statusShort || g?.status || "").toUpperCase();
    // padrões comuns: 1H, 2H, LIVE, HT, ET, PEN
    return ["1H","2H","LIVE","HT","ET","PEN","BT"].includes(s);
  }
  function isFT(g){
    const s = (g?.statusShort || g?.status || "").toUpperCase();
    return ["FT","AET","PEN"].includes(s) && (g?.finished === true || s === "FT" || s === "AET");
  }

  // Minuto “andando” localmente:
  // Se o JSON vier com elapsed/minute, usamos.
  // Se não vier, mas tiver startTs, estimamos (bem melhor que travar em 90).
  function liveMinute(g){
    const s = (g?.statusShort || g?.status || "").toUpperCase();
    const elapsed = Number(g?.elapsed);
    if (Number.isFinite(elapsed) && elapsed > 0) {
      // se tiver extra (45+2)
      const extra = Number(g?.extra);
      if (Number.isFinite(extra) && extra > 0) return `${elapsed}+${extra}'`;
      return `${elapsed}'`;
    }

    const start = Number(g?.startTs || g?.fixtureTs || g?.ts);
    if (!Number.isFinite(start)) return "AO VIVO";

    const diffMin = Math.max(0, Math.floor((nowMs() - start) / 60000));
    // regra simples: não deixa estourar 130 para evitar bizarrice
    const safe = Math.min(diffMin, 130);

    // se no intervalo, mostra HT
    if (s === "HT") return "HT";
    // se travar em 90, pelo menos continua: 90+...
    if (safe >= 90) return "90+'";
    return `${safe}'`;
  }

  // Filtro “exato” (1h/3h/6h/12h):
  // - só jogos COM horário (startTs)
  // - só jogos que AINDA NÃO começaram
  // - start dentro da janela (agora .. agora+N)
  function inNextHoursExact(g, hours){
    const start = Number(g?.startTs);
    if (!Number.isFinite(start)) return false;
    const n = nowMs();
    if (start <= n) return false; // já começou -> NÃO entra nos chips de horas
    const max = n + (hours * 3600 * 1000);
    return start <= max;
  }

  function matchQuery(g){
    if (!q) return true;
    const hay = `${g?.home||""} ${g?.away||""} ${g?.league||""}`.toLowerCase();
    return hay.includes(q.toLowerCase());
  }

  function matchFavOnly(g){
    if (!favOnly) return true;
    return favs.has(String(g?.id));
  }

  function applyFilters(){
    let arr = RAW.slice();

    // modo filtro
    if (filterMode === "live") {
      arr = arr.filter(isLive);
    } else if (filterMode !== "all") {
      const h = Number(filterMode);
      arr = arr.filter(g => inNextHoursExact(g, h));
    }

    arr = arr.filter(matchQuery).filter(matchFavOnly);

    // ordena: ao vivo primeiro, depois por startTs
    arr.sort((a,b) => {
      const al = isLive(a) ? 0 : 1;
      const bl = isLive(b) ? 0 : 1;
      if (al !== bl) return al - bl;
      const at = Number(a?.startTs || 9e15);
      const bt = Number(b?.startTs || 9e15);
      return at - bt;
    });

    view = arr;
    render();
    updateCounts();
  }

  function updateCounts(){
    const c1 = RAW.filter(g=>inNextHoursExact(g,1)).length;
    const c3 = RAW.filter(g=>inNextHoursExact(g,3)).length;
    const c6 = RAW.filter(g=>inNextHoursExact(g,6)).length;
    const c12 = RAW.filter(g=>inNextHoursExact(g,12)).length;
    const cl = RAW.filter(isLive).length;

    $("c1").textContent = c1 ? `(${c1})` : "";
    $("c3").textContent = c3 ? `(${c3})` : "";
    $("c6").textContent = c6 ? `(${c6})` : "";
    $("c12").textContent = c12 ? `(${c12})` : "";
    $("clive").textContent = cl ? `(${cl})` : "";
  }

  function statusBadge(g){
    if (isLive(g)) return `<span class="badge live">${liveMinute(g)}</span>`;
    if (isFT(g)) return `<span class="badge ft">FT</span>`;
    const st = Number(g?.startTs);
    if (Number.isFinite(st) && st > nowMs()) return `<span class="badge soon">${fmtDate(st)} ${fmtTime(st)}</span>`;
    return `<span class="badge">—</span>`;
  }

  function scoreText(g){
    const hs = Number(g?.homeGoals);
    const as = Number(g?.awayGoals);
    if (Number.isFinite(hs) && Number.isFinite(as)) return `${hs} - ${as}`;
    return "—";
  }

  function render(){
    grid.innerHTML = "";

    if (!view.length){
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    const frag = document.createDocumentFragment();

    view.forEach(g => {
      const id = String(g?.id);
      const card = document.createElement("article");
      card.className = "card";
      card.dataset.id = id;

      const isFav = favs.has(id);

      card.innerHTML = `
        <div class="cardHead">
          <div class="favBtn ${isFav ? "on" : ""}" data-act="fav" title="Favoritar">${isFav ? "★" : "☆"}</div>
          <div class="headMain">
            <div class="teams">
              <span>${escapeHtml(g?.home || "—")}</span>
              <span class="vs">vs</span>
              <span>${escapeHtml(g?.away || "—")}</span>
            </div>
            <div class="meta">
              ${statusBadge(g)}
              <span class="badge">${escapeHtml(g?.league || "Liga")}</span>
            </div>
          </div>
          <div class="score">${scoreText(g)}</div>
        </div>

        <details>
          <summary>
            <span>Detalhes</span>
            <span style="opacity:.7">⌄</span>
          </summary>
          <div class="detailsBody">
            <div class="kv"><span>Início</span><b>${formatStart(g)}</b></div>
            <div class="kv"><span>Status</span><b>${escapeHtml(String((g?.statusShort||g?.status||"—")).toUpperCase())}</b></div>
            <div class="kv"><span>ID</span><b>${escapeHtml(id)}</b></div>
          </div>
        </details>
      `;

      frag.appendChild(card);
    });

    grid.appendChild(frag);
  }

  function formatStart(g){
    const st = Number(g?.startTs);
    if (!Number.isFinite(st)) return "Sem horário";
    return `${fmtDate(st)} ${fmtTime(st)}`;
  }

  function escapeHtml(s){
    return String(s ?? "").replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  // Fecha outros detalhes quando abre um
  function wireDetailsCloseOthers(){
    grid.addEventListener("toggle", (e) => {
      if (!(e.target instanceof HTMLDetailsElement)) return;
      if (!e.target.open) return;
      const all = grid.querySelectorAll("details[open]");
      all.forEach(d => { if (d !== e.target) d.open = false; });
    }, true);
  }

  // Favoritar
  function wireFav(){
    grid.addEventListener("click", (e) => {
      const btn = e.target.closest?.("[data-act='fav']");
      if (!btn) return;
      const card = e.target.closest(".card");
      if (!card) return;
      const id = card.dataset.id;
      if (!id) return;

      if (favs.has(id)) favs.delete(id);
      else favs.add(id);

      localStorage.setItem(LS_FAV, JSON.stringify([...favs]));
      applyFilters();
      showToast(favs.has(id) ? "Adicionado aos Favoritos" : "Removido dos Favoritos");
    });
  }

  // Chips
  function wireChips(){
    chips.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;

      [...chips.querySelectorAll(".chip")].forEach(c=>c.classList.remove("on"));
      chip.classList.add("on");

      filterMode = chip.dataset.hours;
      applyFilters();
    });
  }

  // Busca
  function wireSearch(){
    $("q").addEventListener("input", (e) => {
      q = e.target.value.trim();
      applyFilters();
    });
  }

  // Menu
  function wireMenu(){
    menuBtn.addEventListener("click", () => {
      menuPanel.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
      if (e.target === menuBtn || menuBtn.contains(e.target)) return;
      if (menuPanel.contains(e.target)) return;
      menuPanel.classList.remove("open");
    });

    menuPanel.addEventListener("click", (e) => {
      const item = e.target.closest(".menuItem");
      if (!item) return;
      const act = item.dataset.action;

      if (act === "favOnly"){
        favOnly = !favOnly;
        showToast(favOnly ? "Mostrando só Favoritos" : "Mostrando tudo");
        applyFilters();
      }

      if (act === "history"){
        const last = hist.slice(-12).reverse();
        alert(last.length ? "Histórico (últimos):\n\n" + last.join("\n") : "Histórico vazio.");
      }

      if (act === "settings"){
        alert("Configurações:\n\n• Atualização do JSON: 60s\n• Minuto ao vivo (local): 15s\n\n(Se quiser, eu abro uma tela de config real.)");
      }

      menuPanel.classList.remove("open");
    });
  }

  // Carregar JSON sem cache agressivo
  async function fetchJson(){
    const bust = `?t=${Date.now()}`;
    const res = await fetch(OUT_URL + bust, { cache: "no-store" });
    if (!res.ok) throw new Error("Falha ao carregar jogos.json");
    const data = await res.json();

    // Aceita formatos: {games:[...]} ou [...]
    const games = Array.isArray(data) ? data : (data?.games || []);
    // Não deixa “sumir tudo” no front se vier vazio (em cota estourada ou erro de pipeline)
    // Mas se você quiser permitir vazio, só remove esse bloco.
    if (!games.length && RAW.length){
      showToast("Snapshot vazio recebido — mantendo último válido");
      return;
    }

    RAW = normalizeGames(games);
    applyFilters();

    // Subline
    subline.textContent = `Atualizado: ${new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} • Jogos: ${RAW.length}`;
  }

  // Normalização mínima para garantir campos padrão
  function normalizeGames(games){
    return games.map(g => {
      const id = g?.id ?? g?.fixture?.id ?? g?.fixtureId ?? `${g?.home}-${g?.away}-${g?.startTs}`;
      const startTs =
        Number(g?.startTs) ||
        Number(g?.fixtureTs) ||
        (Number.isFinite(Date.parse(g?.date)) ? Date.parse(g.date) : NaN) ||
        (Number.isFinite(Date.parse(g?.fixture?.date)) ? Date.parse(g.fixture.date) : NaN);

      const statusShort =
        g?.statusShort ||
        g?.fixture?.status?.short ||
        g?.status?.short ||
        g?.short ||
        g?.status;

      const elapsed =
        g?.elapsed ??
        g?.fixture?.status?.elapsed ??
        g?.status?.elapsed;

      const extra =
        g?.extra ??
        g?.fixture?.status?.extra ??
        g?.status?.extra;

      const homeGoals =
        g?.homeGoals ??
        g?.goals?.home ??
        g?.score?.fulltime?.home ??
        g?.score?.halftime?.home;

      const awayGoals =
        g?.awayGoals ??
        g?.goals?.away ??
        g?.score?.fulltime?.away ??
        g?.score?.halftime?.away;

      const home = g?.home || g?.teams?.home?.name || g?.fixture?.teams?.home?.name || g?.teamHome;
      const away = g?.away || g?.teams?.away?.name || g?.fixture?.teams?.away?.name || g?.teamAway;

      const league = g?.league || g?.league?.name || g?.fixture?.league?.name || g?.competition;

      return {
        id: String(id),
        startTs: Number.isFinite(startTs) ? startTs : null,
        statusShort: statusShort ? String(statusShort).toUpperCase() : "",
        elapsed: Number.isFinite(Number(elapsed)) ? Number(elapsed) : null,
        extra: Number.isFinite(Number(extra)) ? Number(extra) : null,
        homeGoals: Number.isFinite(Number(homeGoals)) ? Number(homeGoals) : null,
        awayGoals: Number.isFinite(Number(awayGoals)) ? Number(awayGoals) : null,
        home: home ? String(home) : "—",
        away: away ? String(away) : "—",
        league: league ? String(league) : "—",
        // para estimar minuto: usa startTs como base
        startBase: Number.isFinite(startTs) ? startTs : null
      };
    }).filter(x => x.id);
  }

  // Tick local do ao vivo (sem depender do JSON)
  function liveTick(){
    // só re-renderiza se tiver algo ao vivo na tela
    if (!view.some(isLive)) return;
    render();
  }

  // refresh manual
  refreshBtn.addEventListener("click", async () => {
    try{
      await fetchJson();
      showToast("Atualizado");
    }catch(err){
      showToast("Falha ao atualizar (mantendo snapshot)");
    }
  });

  // boot
  wireDetailsCloseOthers();
  wireFav();
  wireChips();
  wireSearch();
  wireMenu();

  // primeira carga
  fetchJson().catch(() => {
    subline.textContent = "Sem dados no momento (verifique jogos.json)";
    RAW = [];
    applyFilters();
  });

  // polling do JSON
  setInterval(() => {
    fetchJson().catch(()=>{ /* mantém snapshot */ });
  }, POLL_MS);

  // minuto ao vivo (local)
  setInterval(liveTick, LIVE_TICK_MS);

})();
</script>
</body>
</html>
