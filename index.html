<script>
    const LS_API_KEY = "RADAR_API_URL";
    const DEFAULT_LOCAL_URL = "jogos.json";
    const REFRESH_MS = 30_000;

    // mantém jogos finalizados por X minutos (pra não sumir “do nada”)
    const KEEP_FINISHED_MINUTES = 20;

    const EUROPE = new Set([
      "Albania","Andorra","Armenia","Austria","Azerbaijan","Belarus","Belgium","Bosnia","Bulgaria","Croatia","Cyprus",
      "Czech Republic","Denmark","England","Estonia","Finland","France","Georgia","Germany","Greece","Hungary","Iceland",
      "Ireland","Italy","Kazakhstan","Kosovo","Latvia","Liechtenstein","Lithuania","Luxembourg","Malta","Moldova","Monaco",
      "Montenegro","Netherlands","North Macedonia","Northern Ireland","Norway","Poland","Portugal","Romania","Russia",
      "San Marino","Scotland","Serbia","Slovakia","Slovenia","Spain","Sweden","Switzerland","Turkey","Ukraine","Wales",
      "UK","United Kingdom"
    ]);

    const ICONS = {
      all: { icon: "📡", label: "Tudo" },
      football: { icon: "⚽", label: "Futebol" },
      tennis: { icon: "🎾", label: "Tênis" },
      basketball: { icon: "🏀", label: "Basquete" },
      volley: { icon: "🏐", label: "Vôlei" },
    };

    const state = {
      page:"home",
      sport:"all",
      hours:1,
      data:null,
      collapsed:new Set(),
      pill:null,
      sort:"popular",
      apiUrl: (localStorage.getItem(LS_API_KEY) || "").trim()
    };

    const pages = {
      home: document.getElementById("page-home"),
      live: document.getElementById("page-live"),
      games: document.getElementById("page-games"),
      bets: document.getElementById("page-bets"),
      pro: document.getElementById("page-pro"),
    };

    /* NAV */
    document.querySelectorAll(".navbtn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const p = btn.dataset.page;
        setPage(p);
      });
    });

    function setPage(p){
      state.page = p;
      Object.values(pages).forEach(el=>el.classList.remove("active"));
      pages[p].classList.add("active");

      document.querySelectorAll(".navbtn").forEach(b=>{
        b.classList.toggle("active", b.dataset.page===p);
      });

      window.scrollTo({top:0, behavior:"instant"});
      renderAll();
    }

    function wireProBanner(id){
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener("click", ()=> setPage("pro"));
    }
    wireProBanner("bannerProHome");
    wireProBanner("bannerProLive");

    document.getElementById("btnRegister").addEventListener("click", ()=>alert("Cadastro (placeholder)."));
    document.getElementById("btnLogin").addEventListener("click", ()=>alert("Login (placeholder)."));

    /* Popular pills */
    const pillsWrap = document.getElementById("popularPills");
    pillsWrap.querySelectorAll(".pill").forEach(p=>{
      p.addEventListener("click", ()=>{
        const key = p.dataset.pill || null;
        state.pill = (state.pill === key) ? null : key;

        pillsWrap.querySelectorAll(".pill").forEach(x=>{
          x.classList.toggle("active", x.dataset.pill === state.pill);
        });

        if(state.pill === "nba"){ state.sport = "basketball"; }
        else if(state.pill === "br"){ state.sport = "football"; }

        renderAll();
      });
    });

    /* Sort */
    const sortLabel = document.getElementById("sortLabel");
    sortLabel.addEventListener("click", ()=>{
      state.sort = (state.sort === "popular") ? "time" : "popular";
      sortLabel.textContent = state.sort === "popular" ? "⇅ Popular primeiro ▾" : "⏱️ Horário ▾";
      renderAll();
    });

    /* Time chips */
    document.querySelectorAll(".tchip").forEach(ch=>{
      ch.addEventListener("click", ()=>{
        document.querySelectorAll(".tchip").forEach(x=>x.classList.remove("active"));
        ch.classList.add("active");
        state.hours = Number(ch.dataset.hours || 1);
        renderAll();
      });
    });

    /* Settings / filters buttons */
    document.getElementById("btnSettings").addEventListener("click", openApiModal);
    document.getElementById("openApiModal").addEventListener("click", openApiModal);

    document.getElementById("btnFilters").addEventListener("click", ()=>{
      state.pill = null;
      pillsWrap.querySelectorAll(".pill").forEach(x=>x.classList.remove("active"));
      state.sport = "all";
      state.sort = "popular";
      sortLabel.textContent = "⇅ Popular primeiro ▾";
      renderAll();
    });

    /* Long press brand */
    const brandTap = document.getElementById("brandTap");
    let pressTimer = null;
    brandTap.addEventListener("touchstart", ()=>{ pressTimer = setTimeout(openApiModal, 520); }, {passive:true});
    brandTap.addEventListener("touchend", ()=>clearTimeout(pressTimer), {passive:true});
    brandTap.addEventListener("mousedown", ()=>{ pressTimer = setTimeout(openApiModal, 520); });
    brandTap.addEventListener("mouseup", ()=>clearTimeout(pressTimer));
    brandTap.addEventListener("mouseleave", ()=>clearTimeout(pressTimer));

    /* MODAL */
    const apiModal = document.getElementById("apiModal");
    const apiInput = document.getElementById("apiInput");
    const apiCancel = document.getElementById("apiCancel");
    const apiClear = document.getElementById("apiClear");
    const apiSave = document.getElementById("apiSave");

    function openApiModal(){
      apiInput.value = state.apiUrl || "";
      apiModal.classList.add("open");
      setTimeout(()=>apiInput.focus(), 50);
    }
    function closeApiModal(){ apiModal.classList.remove("open"); }

    apiModal.addEventListener("click", (e)=>{ if(e.target === apiModal) closeApiModal(); });
    apiCancel.addEventListener("click", closeApiModal);

    apiClear.addEventListener("click", ()=>{
      state.apiUrl = "";
      localStorage.removeItem(LS_API_KEY);
      closeApiModal();
      loadData(true);
    });

    apiSave.addEventListener("click", ()=>{
      const v = (apiInput.value || "").trim();
      state.apiUrl = v;
      if(v) localStorage.setItem(LS_API_KEY, v);
      else localStorage.removeItem(LS_API_KEY);
      closeApiModal();
      loadData(true);
    });

    /* DATA LOAD */
    function buildDataUrl(){
      const base = state.apiUrl || DEFAULT_LOCAL_URL;
      const sep = base.includes("?") ? "&" : "?";
      return base + sep + "ts=" + Date.now();
    }

    async function fetchJsonWithTimeout(url, timeoutMs=9000){
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), timeoutMs);
      try{
        const res = await fetch(url, {cache:"no-store", signal: ctrl.signal});
        if(!res.ok) throw new Error("HTTP " + res.status);
        return await res.json();
      }finally{ clearTimeout(t); }
    }

    async function loadData(){
      try{
        const url = buildDataUrl();
        const json = await fetchJsonWithTimeout(url, 9000);

        const games = Array.isArray(json) ? json
          : (Array.isArray(json.games) ? json.games
          : (Array.isArray(json.data) ? json.data
          : (Array.isArray(json.events) ? json.events : [])));

        state.data = { games };
      }catch(e){
        if(state.apiUrl){
          try{
            const fallback = await fetchJsonWithTimeout(DEFAULT_LOCAL_URL + "?ts=" + Date.now(), 9000);
            const games = Array.isArray(fallback) ? fallback : (fallback.games || fallback.data || fallback.events || []);
            state.data = { games: Array.isArray(games) ? games : [] };
          }catch(_){ state.data = { games: [] }; }
        }else{
          state.data = { games: [] };
        }
      }
      renderAll();
    }

    /* ======== PARSE DE DATA/HORA ======== */
    function parseStartTsAny(g){
      const candidates = [
        g.startTs, g.kickoffTs, g.timestamp, g.start_time, g.startTime, g.date, g.datetime,
        g.commence_time, g.kickoff, g.start, g.timeStart, g.beginTime,
        g.startTimestamp, g.time?.start, g.fixture?.timestamp
      ].filter(v=>v!=null && v!=="");

      for(const v of candidates){
        if(typeof v === "number"){
          if(v > 1e12) return Math.floor(v/1000);
          if(v > 1e9) return Math.floor(v);
        }
        if(typeof v === "string"){
          const s = v.trim();
          if(/^\d{10,13}$/.test(s)){
            const n = Number(s);
            if(n > 1e12) return Math.floor(n/1000);
            return Math.floor(n);
          }
          const ms = Date.parse(s);
          if(Number.isFinite(ms)) return Math.floor(ms/1000);
        }
      }
      return null;
    }

    function toNum(v){
      if(v==null) return null;
      if(typeof v==="number") return Number.isFinite(v) ? v : null;
      if(typeof v==="string"){
        const s = v.trim().replace(",",".");
        const n = Number(s);
        return Number.isFinite(n) ? n : null;
      }
      return null;
    }

    function extractOdds(g){
      const odds = g.odds || g.market1x2 || g.oneXtwo || g.prices || null;
      if(!odds) return {home:null, draw:null, away:null};
      const home = odds.home ?? odds["1"] ?? odds.h ?? odds.team1 ?? null;
      const draw = odds.draw ?? odds["x"] ?? odds.d ?? odds.tie ?? null;
      const away = odds.away ?? odds["2"] ?? odds.a ?? odds.team2 ?? null;
      return {home, draw, away};
    }

    function extractProbs(g){
      const pickNum = (v)=>{
        if(v==null) return null;
        if(typeof v==="number") return v;
        if(typeof v==="string"){
          const s=v.trim().replace("%","");
          const n=Number(s);
          if(!Number.isFinite(n)) return null;
          return n;
        }
        return null;
      };

      const cand = [
        g.probabilities, g.probs, g.prob, g.chances, g.probability
      ].find(v=>v && typeof v==="object");

      let ph=null,pd=null,pa=null;

      if(cand){
        ph = pickNum(cand.home ?? cand.h ?? cand["1"] ?? cand.team1 ?? cand.local ?? cand.host);
        pd = pickNum(cand.draw ?? cand.d ?? cand["x"] ?? cand.tie);
        pa = pickNum(cand.away ?? cand.a ?? cand["2"] ?? cand.team2 ?? cand.visitor ?? cand.guest);
      }

      if(ph==null) ph = pickNum(g.probHome ?? g.p1 ?? g.prob1 ?? g.homeProb ?? g.chanceHome);
      if(pd==null) pd = pickNum(g.probDraw ?? g.px ?? g.probX ?? g.drawProb ?? g.chanceDraw);
      if(pa==null) pa = pickNum(g.probAway ?? g.p2 ?? g.prob2 ?? g.awayProb ?? g.chanceAway);

      const norm = (x)=>{
        if(x==null) return null;
        if(x>1 && x<=100) return x/100;
        if(x>=0 && x<=1) return x;
        return null;
      };

      ph = norm(ph); pd = norm(pd); pa = norm(pa);

      if(ph==null && pd==null && pa==null){
        const o = extractOdds(g);
        const oh = toNum(o.home), od = toNum(o.draw), oa = toNum(o.away);
        if(oh && od && oa){
          const ih = 1/oh, id = 1/od, ia = 1/oa;
          const s = ih+id+ia;
          if(s>0){
            ph = ih/s; pd = id/s; pa = ia/s;
          }
        }
      }

      return {home: ph, draw: pd, away: pa};
    }

    function extractScorePair(g){
      const tryStr = (v)=>{
        if(typeof v!=="string") return null;
        const m = v.match(/(\d+)\s*[-:]\s*(\d+)/);
        if(!m) return null;
        return {home: Number(m[1]), away: Number(m[2])};
      };

      let p = tryStr(g.score || g.result || g.fullScore || g.ftScore || g.currentScore);
      if(p) return p;

      const so = g.score || g.scores || g.goals || g.result;
      if(so && typeof so==="object"){
        const h = so.home ?? so.h ?? so.local ?? so.team1 ?? so["1"];
        const a = so.away ?? so.a ?? so.visitor ?? so.team2 ?? so["2"];
        if(h!=null && a!=null){
          const nh = Number(h), na = Number(a);
          if(Number.isFinite(nh) && Number.isFinite(na)) return {home: nh, away: na};
        }
      }

      if(g.scores && typeof g.scores==="object"){
        const nh = Number(g.scores.home ?? g.scores.h);
        const na = Number(g.scores.away ?? g.scores.a);
        if(Number.isFinite(nh) && Number.isFinite(na)) return {home: nh, away: na};
      }

      return {home: null, away: null};
    }

    function formatOddOrProb(valOdd, valProb){
      if(valProb!=null && Number.isFinite(valProb)){
        return Math.round(valProb*100) + "%";
      }
      if(valOdd==null) return null;
      const n = toNum(valOdd);
      if(n==null) return null;
      return (Math.round(n*100)/100).toFixed(2);
    }

    function normalizeGames(raw){
      if(!Array.isArray(raw)) return [];
      return raw.map(g=>{
        const sport = (g.sport || g.sportKey || g.category || "football").toLowerCase();
        const league = g.league || g.competition || g.leagueName || g.tournament || "Liga";
        const country = g.country || g.area || g.region || g.nation || "";
        const home = g.home || g.homeTeam || g.team1 || g.localteam || g.teams?.home?.name || "Casa";
        const away = g.away || g.awayTeam || g.team2 || g.visitorteam || g.teams?.away?.name || "Fora";
        const statusRaw = (g.status || g.state || g.fixture?.status?.short || (g.live ? "LIVE" : "NS"));
        const status = String(statusRaw || "").toUpperCase().replace(/\s+/g,"_");

        const minute = (g.minute != null ? String(g.minute)
          : (g.elapsed != null ? String(g.elapsed)
          : (g.time?.elapsed != null ? String(g.time.elapsed)
          : (g.fixture?.status?.elapsed != null ? String(g.fixture.status.elapsed)
          : (g.time || g.clock || "")))));

        const startTs = parseStartTsAny(g);

        const sp = extractScorePair(g);
        const scoreHome = (g.scoreHome !=null ? g.scoreHome : (g.goalsHome != null ? g.goalsHome : (g.homeScore ?? (g.scores?.home ?? sp.home))));
        const scoreAway = (g.scoreAway !=null ? g.scoreAway : (g.goalsAway != null ? g.goalsAway : (g.awayScore ?? (g.scores?.away ?? sp.away))));

        const oddsRaw = extractOdds(g);
        const probs = extractProbs(g);

        const odds = {
          home: formatOddOrProb(oddsRaw.home, probs.home),
          draw: formatOddOrProb(oddsRaw.draw, probs.draw),
          away: formatOddOrProb(oddsRaw.away, probs.away)
        };

        const id = g.id || g.fixture?.id || g.event_id || `${league}-${home}-${away}-${startTs || ""}`;

        return {
          id, sport, league, country, home, away,
          status, minute, startTs,
          scoreHome, scoreAway,
          odds,
          probs
        };
      });
    }

    function isLive(g){
      const s = (g.status || "").toUpperCase();

      if(isFinished(g)) return false;

      const now = Date.now();
      if(g.startTs){
        const startMs = Number(g.startTs) * 1000;
        if(Number.isFinite(startMs)){
          if(startMs - now > 10 * 60 * 1000) return false;
          if(now - startMs > 4.5 * 3600 * 1000) return false;
        }
      }

      const liveSet = new Set([
        "LIVE","INPLAY","IN_PLAY","1H","2H","HT","ET","PEN",
        "FIRST_HALF","SECOND_HALF","HALF_TIME","RUNNING","PLAYING"
      ]);
      if(liveSet.has(s)) return true;

      const m = String(g.minute || "").trim();
      if(m.includes("'")) return true;

      const n = Number(m.replace(/[^0-9]/g,""));
      if(Number.isFinite(n) && n >= 1 && n <= 140) return true;

      if((g.scoreHome!=null || g.scoreAway!=null) && (s.includes("LIVE") || s.includes("PLAY") || s.includes("RUN"))){
        return true;
      }
      return false;
    }

    function isFinished(g){
      const s = (g.status || "").toUpperCase();
      return s === "FT" || s === "FULL_TIME" || s === "FINISHED" || s === "ENDED" || s === "FINAL";
    }

    function finishedTooOld(g){
      if(!isFinished(g)) return false;
      if(!g.startTs) return true;
      const now = Date.now();
      const startMs = Number(g.startTs) * 1000;
      if(!Number.isFinite(startMs)) return true;

      const ageMin = (now - startMs) / 60000;
      return ageMin > (KEEP_FINISHED_MINUTES + 150); // margem
    }

    function startsWithinHours(g, hours){
      if(!g.startTs) return false;
      const now = Date.now();
      const ts = Number(g.startTs)*1000;
      if(!Number.isFinite(ts)) return false;
      return (ts - now) <= hours*3600*1000 && (ts - now) >= 0;
    }

    function groupByLeague(games){
      const map = new Map();
      games.forEach(g=>{
        const key = `${g.country} • ${g.league}`.trim();
        if(!map.has(key)) map.set(key, []);
        map.get(key).push(g);
      });
      return Array.from(map.entries());
    }

    function formatMinute(g){
      const m = String(g.minute || "").trim();
      if(!m) return "";
      if(m.includes(":")) return m;
      if(m.endsWith("'")) return m.replace("'", "") + ":00";
      const n = Number(m);
      if(Number.isFinite(n)) return String(n).padStart(2,"0") + ":00";
      return m;
    }

    function formatKickoff(g){
      if(!g.startTs) return "";
      const d = new Date(Number(g.startTs)*1000);
      return d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    }

    function shortName(s){
      if(!s) return "";
      return s.length > 20 ? s.slice(0,18) + "…" : s;
    }

    function safeTimeSort(a,b){
      const ta = Number(a.startTs || 0);
      const tb = Number(b.startTs || 0);
      if(!ta && !tb) return 0;
      if(!ta) return 1;
      if(!tb) return -1;
      return ta - tb;
    }

    function applyPillFilter(games){
      if(!state.pill) return games;

      if(state.pill === "eu"){
        return games.filter(g=>{
          const c = (g.country || "").trim();
          if(c && EUROPE.has(c)) return true;
          return /europe|uefa|champions|europa|premier|la liga|serie a|bundesliga|ligue 1/i.test(g.league || "");
        });
      }
      if(state.pill === "br"){
        return games.filter(g=>/brazil|brasil/i.test(g.country || "") || /brasile/i.test(g.league || ""));
      }
      if(state.pill === "nba"){
        return games.filter(g=>/nba/i.test(g.league || "") || g.sport.includes("basket"));
      }
      if(state.pill === "top"){
        return games.filter(g=>{
          const L = (g.league || "").toLowerCase();
          return /(premier|la liga|serie a|bundesliga|ligue 1|champions|europa|nba|libertadores|sul-americana|copa do brasil|brasileir)/i.test(L);
        });
      }
      if(state.pill === "odds"){
        return games.filter(g=> g.odds && (g.odds.home!=null || g.odds.draw!=null || g.odds.away!=null));
      }
      if(state.pill === "esports"){
        return games.filter(g=>/esport|e-sport|cs:go|valorant|lol|league of legends|dota/i.test((g.league||"") + " " + (g.sport||"")));
      }
      return games;
    }

    /* RENDER */
    const sportsRow = document.getElementById("sportsRow");
    function renderSportsRow(counts){
      sportsRow.innerHTML = "";
      const items = [
        ["all", ICONS.all],
        ["football", ICONS.football],
        ["tennis", ICONS.tennis],
        ["basketball", ICONS.basketball],
        ["volley", ICONS.volley],
      ];
      items.forEach(([key, meta])=>{
        const el = document.createElement("div");
        el.className = "sport-item" + (state.sport===key ? " active" : "");
        el.innerHTML = `
          <div class="sport-icon">${meta.icon}</div>
          <div class="badge">${(counts && counts[key] != null) ? counts[key] : 0}</div>
          <div>${meta.label}</div>
          <div class="underline"></div>
        `;
        el.addEventListener("click", ()=>{
          state.sport = key;
          renderAll();
        });
        sportsRow.appendChild(el);
      });
    }

    function renderHero(el, liveGames, hotGames){
      el.innerHTML = "";
      const picks = (liveGames.length > 0 ? liveGames.slice(0, 6) : hotGames.slice(0, 6));

      if(picks.length === 0){
        const card = document.createElement("div");
        card.className = "hero-card";
        card.innerHTML = `
          <div class="hero-inner">
            <div class="live-chip"><span class="live-dot"></span>DESTAQUES</div>
            <div class="hero-title">Sem destaques agora</div>
            <div class="hero-sub"><span>Atualize mais tarde.</span></div>
            <div class="odds-strip">
              <div class="odd"><span>1</span>—</div>
              <div class="odd"><span>X</span>—</div>
              <div class="odd"><span>2</span>—</div>
            </div>
          </div>
        `;
        el.appendChild(card);
        return;
      }

      picks.forEach(g=>{
        const live = isLive(g);
        const scoreTxt = (g.scoreHome!=null && g.scoreAway!=null) ? `${g.scoreHome} - ${g.scoreAway}` : "—";
        const clock = live ? (formatMinute(g) || "AO VIVO") : (formatKickoff(g) ? ("Começa " + formatKickoff(g)) : "Em breve");

        const card = document.createElement("div");
        card.className = "hero-card";
        card.innerHTML = `
          <div class="hero-inner">
            <div class="live-chip">
              <span class="live-dot"></span>${live ? "AO VIVO" : "QUENTE"}
            </div>

            <div class="hero-title">${shortName(g.home)}<br/>${shortName(g.away)}</div>

            <div class="hero-sub">
              <span>${g.country || "World"} • ${g.league}</span>
              <span class="score-pill">${scoreTxt} &nbsp;•&nbsp; ${clock}</span>
            </div>

            <div class="odds-strip">
              <div class="odd"><span>1</span>${g.odds?.home ?? "—"}</div>
              <div class="odd"><span>X</span>${g.odds?.draw ?? "—"}</div>
              <div class="odd"><span>2</span>${g.odds?.away ?? "—"}</div>
            </div>
          </div>
        `;
        el.appendChild(card);
      });
    }

    function renderLiveList(container, games){
      container.innerHTML = "";
      if(games.length === 0){
        container.innerHTML = `<div style="text-align:center;padding:18px 12px;color:rgba(233,244,246,.70);font-weight:900;">Sem jogos ao vivo no momento.</div>`;
        return;
      }
      const groups = groupByLeague(games);
      groups.forEach(([leagueName, items])=>{
        const wrap = document.createElement("div");
        wrap.className = "league";
        const collapsed = state.collapsed.has(leagueName);
        wrap.innerHTML = `
          <div class="league-head">
            <div class="left">
              <div class="flag">🌍</div>
              <div style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${leagueName || "Liga"}</div>
            </div>
            <div class="collapse" data-key="${encodeURIComponent(leagueName)}">${collapsed ? "▾" : "▴"}</div>
          </div>
          <div class="league-body" style="display:${collapsed ? "none":"block"}"></div>
        `;
        const body = wrap.querySelector(".league-body");

        items.slice(0, 10).forEach(g=>{
          const sh = (g.scoreHome!=null && g.scoreAway!=null) ? `${g.scoreHome} - ${g.scoreAway}` : "—";
          const min = formatMinute(g) || "—";
          const m = document.createElement("div");
          m.className = "match";
          m.innerHTML = `
            <div class="match-top">
              <div class="teams">
                <div class="team-row"><div class="ball">⚽</div>${shortName(g.home)}</div>
                <div class="team-row"><div class="ball">⚽</div>${shortName(g.away)}</div>
              </div>
              <div class="meta">
                <div class="live-badge"><span class="live-dot" style="width:8px;height:8px;box-shadow:0 0 0 3px rgba(255,47,125,.16)"></span>AO VIVO</div>
                <div class="mini-score">${sh} &nbsp;•&nbsp; ${min}</div>
              </div>
            </div>
            <div class="odds-strip">
              <div class="odd"><span>1</span>${g.odds?.home ?? "—"}</div>
              <div class="odd"><span>X</span>${g.odds?.draw ?? "—"}</div>
              <div class="odd"><span>2</span>${g.odds?.away ?? "—"}</div>
            </div>
          `;
          body.appendChild(m);
        });

        wrap.querySelector(".collapse").addEventListener("click", (e)=>{
          const k = decodeURIComponent(e.currentTarget.dataset.key);
          if(state.collapsed.has(k)) state.collapsed.delete(k);
          else state.collapsed.add(k);
          renderAll();
        });

        container.appendChild(wrap);
      });
    }

    function renderGamesSheet(container, games){
      container.innerHTML = "";
      if(games.length === 0){
        container.innerHTML = `<div style="text-align:center;padding:18px 12px;color:#214049;font-weight:950;">Sem jogos nas próximas ${state.hours}h com esses filtros.</div>`;
        return;
      }
      const groups = groupByLeague(games);
      groups.forEach(([leagueName, items])=>{
        const block = document.createElement("div");
        block.className = "sheet-league";
        block.innerHTML = `
          <div class="sheet-league-head">
            <div class="left"><div class="flag">🌍</div><div style="font-weight:950;">${leagueName || "Liga"}</div></div>
            <div class="collapse" style="background:#eef2f3;border-color:rgba(0,0,0,.06);">▴</div>
          </div>
          <div class="sheet-league-body"></div>
        `;
        const body = block.querySelector(".sheet-league-body");

        items.slice(0, 20).forEach(g=>{
          const c = document.createElement("div");
          c.className = "sheet-card";
          const timeTxt = g.startTs ? ("dom. " + formatKickoff(g)) : "horário indefinido";
          c.innerHTML = `
            <div class="sheet-card-top">
              <div class="sheet-teams">
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="ball" style="background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.06)">⚽</div>
                  ${shortName(g.home)}
                </div>
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="ball" style="background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.06)">⚽</div>
                  ${shortName(g.away)}
                </div>
              </div>
              <div class="sheet-meta">
                <div>${timeTxt}</div>
                <div style="display:flex;gap:10px;align-items:center;">
                  <span style="font-size:18px;">▶️</span>
                  <span style="font-size:18px;">⚡</span>
                </div>
              </div>
            </div>
            <div class="sheet-odds">
              <div class="sheet-odd"><span>1</span>${g.odds?.home ?? "—"}</div>
              <div class="sheet-odd"><span>X</span>${g.odds?.draw ?? "—"}</div>
              <div class="sheet-odd"><span>2</span>${g.odds?.away ?? "—"}</div>
            </div>
          `;
          body.appendChild(c);
        });

        container.appendChild(block);
      });
    }

    function renderAll(){
      const raw = state.data?.games || [];
      const allGames = normalizeGames(raw);

      let games = allGames.slice();

      // remove finalizados “velhos” (corta jogo de ontem / dados travados)
      games = games.filter(g=>!finishedTooOld(g));

      games = games.filter(g=>{
        if(state.sport === "all") return true;
        if(state.sport === "football") return (g.sport.includes("foot") || g.sport==="soccer" || g.sport==="football");
        if(state.sport === "tennis") return g.sport.includes("tennis");
        if(state.sport === "basketball") return g.sport.includes("basket");
        if(state.sport === "volley") return g.sport.includes("volley");
        return true;
      });

      games = applyPillFilter(games);

      const liveGames = games.filter(isLive);

      // “hot games” = começam em até 3h
      const hotGames = games
        .filter(g=>!isLive(g))
        .filter(g=>startsWithinHours(g, 3))
        .sort(safeTimeSort);

      // ✅ PRÓXIMOS JOGOS (ABA JOGOS) — agora é estrito: só FUTURO dentro do range
      let nextGames = games
        .filter(g=>!isLive(g))
        .filter(g=>startsWithinHours(g, state.hours));

      if(state.sort === "time"){
        nextGames = nextGames.slice().sort(safeTimeSort);
      }

      const counts = {
        all: allGames.length,
        football: allGames.filter(g=> (g.sport.includes("foot") || g.sport==="soccer" || g.sport==="football")).length,
        tennis: allGames.filter(g=> g.sport.includes("tennis")).length,
        basketball: allGames.filter(g=> g.sport.includes("basket")).length,
        volley: allGames.filter(g=> g.sport.includes("volley")).length,
      };
      renderSportsRow(counts);

      document.getElementById("liveCountHome").textContent = liveGames.length;
      document.getElementById("liveCount").textContent = liveGames.length;

      renderHero(document.getElementById("heroHome"), liveGames, hotGames);
      renderHero(document.getElementById("heroLive"), liveGames, hotGames);

      renderLiveList(document.getElementById("liveListHome"), liveGames);
      renderLiveList(document.getElementById("liveList"), liveGames);

      renderGamesSheet(document.getElementById("gamesList"), nextGames);
    }

    loadData();
    setInterval(loadData, REFRESH_MS);
        </script>
