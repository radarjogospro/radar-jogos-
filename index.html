<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#071f25"/>
  <title>Radar PRO</title>

  <style>
    :root{
      --bg0:#071f25;
      --bg1:#08252c;

      --t0:#e9f4f6;
      --t1:#b8d2d8;

      --line:rgba(255,255,255,.08);
      --shadow: 0 20px 50px rgba(0,0,0,.35);

      --pink:#ff2f7d;
      --pink2:#e51f69;
      --aqua:#26d0d8;

      --surface: rgba(255,255,255,.06);
      --surface2: rgba(255,255,255,.08);

      --r12: 12px;
      --r14: 14px;
      --r16: 16px;
      --r18: 18px;
      --r20: 20px;

      --pad: 16px;
      --pad2: 12px;
    }

    *{ box-sizing: border-box; }
    html,body{ height: 100%; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--t0);
      background: radial-gradient(1200px 800px at 50% 0%, rgba(255,47,125,.12), transparent 55%),
                  radial-gradient(1000px 700px at 20% 20%, rgba(38,208,216,.10), transparent 55%),
                  linear-gradient(180deg, var(--bg1), var(--bg0));
      overflow-x: hidden;
    }

    /* safe-area */
    .safe{
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      min-height: 100vh;
    }

    /* Top bar */
    .topbar{
      position: sticky;
      top:0;
      z-index: 50;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(180deg, rgba(7,31,37,.92), rgba(7,31,37,.55));
      border-bottom: 1px solid rgba(255,255,255,.06);
      padding: 10px 12px;
    }
    .topbar-row{
      display:flex;
      align-items:center;
      gap: 12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .logo{
      width: 38px;
      height: 38px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      flex: 0 0 auto;
    }
    .logo span{
      font-weight: 800;
      letter-spacing: .5px;
      opacity:.95;
    }
    .brand-text{
      min-width:0;
    }
    .brand-title{
      font-weight: 800;
      letter-spacing: .2px;
      font-size: 16px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub{
      display:flex;
      align-items:center;
      gap:8px;
      font-size: 12px;
      color: var(--t1);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dot{
      width: 9px;
      height: 9px;
      border-radius: 99px;
      background: #35d07f;
      box-shadow: 0 0 0 3px rgba(53,208,127,.15);
      flex: 0 0 auto;
    }
    .spacer{ flex:1; }

    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      padding: 11px 14px;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: .2px;
      background: rgba(255,255,255,.06);
      color: var(--t0);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 14px 35px rgba(0,0,0,.25);
      transition: transform .08s ease, filter .15s ease;
      white-space: nowrap;
    }
    .btn:active{ transform: scale(.98); }
    .btn-primary{
      background: linear-gradient(180deg, var(--pink), var(--pink2));
      border: 0;
    }
    .btn-ghost{
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
    }

    .kebab{
      width: 42px;
      height: 42px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--t0);
      cursor:pointer;
      box-shadow: 0 14px 35px rgba(0,0,0,.25);
    }
    .kebab:active{ transform: scale(.98); }

    /* Menu */
    .menu{
      position: absolute;
      right: 12px;
      top: 58px;
      width: 220px;
      border-radius: 18px;
      background: rgba(10,35,41,.88);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 30px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      display:none;
    }
    .menu.open{ display:block; }
    .menu button{
      width:100%;
      text-align:left;
      padding: 14px 14px;
      background: transparent;
      border: 0;
      color: var(--t0);
      font-weight: 700;
      cursor: pointer;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .menu button:hover{ background: rgba(255,255,255,.06); }
    .menu .sep{
      height:1px;
      background: rgba(255,255,255,.08);
    }
    .ico{
      width: 22px;
      height: 22px;
      display:grid;
      place-items:center;
      border-radius: 8px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
      font-size: 12px;
    }

    /* Content */
    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 12px 110px;
    }

    /* chips top sports */
    .sports{
      display:flex;
      gap: 10px;
      margin: 10px 0 12px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }
    .sports::-webkit-scrollbar{ height:0; }
    .sport{
      flex: 0 0 auto;
      min-width: 78px;
      display:flex;
      flex-direction: column;
      gap: 6px;
      align-items:center;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      cursor:pointer;
      user-select:none;
    }
    .sport.active{
      background: rgba(255,255,255,.07);
      border-color: rgba(38,208,216,.25);
      box-shadow: 0 18px 40px rgba(0,0,0,.25);
    }
    .sport .badge{
      min-width: 40px;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(255,255,255,.10);
      font-weight: 800;
      font-size: 12px;
      text-align:center;
    }
    .sport .lab{
      font-size: 12px;
      color: var(--t1);
    }

    /* CTA row */
    .cta{
      display:flex;
      gap: 10px;
      align-items:center;
      margin: 6px 0 14px;
    }
    .pill{
      flex:1;
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 18px 40px rgba(0,0,0,.22);
      min-width: 0;
    }
    .pill .tag{
      padding: 6px 10px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--pink), var(--pink2));
      font-weight: 900;
      font-size: 12px;
      flex:0 0 auto;
    }
    .pill .text{
      min-width:0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--t0);
      font-weight: 800;
      letter-spacing: .2px;
    }
    .pill .sub{
      margin-left:auto;
      color: var(--t1);
      font-size: 12px;
      font-weight: 700;
      flex:0 0 auto;
    }

    /* Sections */
    .section{
      margin-top: 16px;
    }
    .h{
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -.5px;
      margin: 12px 0 10px;
    }
    .subtabs{
      display:flex;
      gap: 10px;
      overflow-x:auto;
      padding: 4px 0 4px;
      -webkit-overflow-scrolling: touch;
    }
    .subtabs::-webkit-scrollbar{ height:0; }
    .chip{
      flex:0 0 auto;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--t0);
      font-weight: 900;
      cursor:pointer;
      user-select:none;
    }
    .chip.active{
      background: rgba(255,255,255,.08);
      border-color: rgba(38,208,216,.25);
    }

    /* Horizontal highlight cards */
    .highlight-row{
      display:flex;
      gap: 12px;
      overflow-x: auto;
      padding: 10px 2px 6px;
      -webkit-overflow-scrolling: touch;
    }
    .highlight-row::-webkit-scrollbar{ height:0; }
    .card{
      flex: 0 0 auto;
      width: 340px;
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: var(--shadow);
      padding: 16px;
      position: relative;
      overflow: hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:-50px -50px auto auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle at 30% 30%, rgba(255,47,125,.25), transparent 60%);
      filter: blur(1px);
      pointer-events:none;
    }
    .badge-live{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,47,125,.12);
      border: 1px solid rgba(255,47,125,.25);
      font-weight: 900;
      letter-spacing: .4px;
      font-size: 12px;
      text-transform: uppercase;
    }
    .badge-live .dot-live{
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--pink);
      box-shadow: 0 0 0 4px rgba(255,47,125,.12);
    }
    .teams{
      margin-top: 10px;
      font-size: 30px;
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -.6px;
    }
    .meta{
      margin-top: 10px;
      color: var(--t1);
      font-weight: 700;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
    }
    .scorepill{
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      font-weight: 900;
      color: var(--t0);
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .oddsbar{
      margin-top: 14px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .odd{
      padding: 12px 10px;
      display:flex;
      align-items:center;
      justify-content: center;
      gap: 8px;
      font-weight: 900;
    }
    .odd + .odd{ border-left: 1px solid rgba(255,255,255,.08); }
    .odd .k{ color: rgba(255,255,255,.70); font-weight: 900; }
    .odd .v{ color: var(--aqua); font-weight: 900; }

    /* Live list */
    .list-head{
      display:flex;
      align-items:center;
      justify-content: space-between;
      margin-top: 14px;
      margin-bottom: 8px;
    }
    .list-title{
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -.4px;
    }
    .list-count{
      color: var(--t1);
      font-weight: 800;
    }

    .league{
      margin-top: 12px;
      border-radius: 20px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      overflow:hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.22);
    }
    .league-head{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 14px 14px;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: rgba(0,0,0,.10);
    }
    .flag{
      width: 26px;
      height: 26px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      flex:0 0 auto;
    }
    .league-name{
      font-weight: 900;
      color: var(--t0);
      letter-spacing: .2px;
      flex:1;
      min-width:0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .collapse{
      width: 46px;
      height: 36px;
      border-radius: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      display:grid;
      place-items:center;
      cursor:pointer;
      flex:0 0 auto;
    }

    .matches{
      padding: 10px;
      display:flex;
      flex-direction: column;
      gap: 10px;
    }
    .match{
      border-radius: 22px;
      background: rgba(10,35,41,.35);
      border: 1px solid rgba(255,255,255,.08);
      padding: 14px;
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
    }
    .match-top{
      display:flex;
      align-items:flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .teams2{
      display:flex;
      flex-direction: column;
      gap: 6px;
      font-weight: 900;
      letter-spacing: -.3px;
      font-size: 22px;
    }
    .teamrow{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }
    .ball{
      width: 26px;
      height: 26px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      flex: 0 0 auto;
      opacity: .95;
    }
    .teamname{
      min-width:0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .match-right{
      display:flex;
      flex-direction: column;
      align-items:flex-end;
      gap: 8px;
      flex: 0 0 auto;
      min-width: 128px;
    }
    .live-pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,47,125,.12);
      border: 1px solid rgba(255,47,125,.25);
      font-weight: 900;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .live-pill .d{
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--pink);
      box-shadow: 0 0 0 4px rgba(255,47,125,.12);
    }
    .match-time{
      color: var(--t1);
      font-weight: 800;
      font-size: 12px;
    }
    .score{
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.10);
      font-weight: 900;
      letter-spacing: .2px;
      white-space: nowrap;
    }
    .oddsbar2{
      margin-top: 12px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
    }
    .odd2{
      padding: 12px 10px;
      display:flex;
      align-items:center;
      justify-content: center;
      gap: 8px;
      font-weight: 900;
      min-height: 44px;
    }
    .odd2 + .odd2{ border-left: 1px solid rgba(255,255,255,.08); }
    .odd2 .k{ color: rgba(255,255,255,.70); }
    .odd2 .v{ color: var(--aqua); }
    .odd2 .dash{ color: rgba(255,255,255,.35); font-weight: 900; }

    .match-actions{
      margin-top: 12px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn2{
      padding: 12px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.05);
      color: var(--t0);
      font-weight: 900;
      letter-spacing: .2px;
      cursor:pointer;
      box-shadow: 0 18px 45px rgba(0,0,0,.22);
    }
    .btn2:active{ transform: scale(.98); }
    .btn2.star{
      display:flex;
      align-items:center;
      justify-content:center;
      gap: 10px;
    }

    /* Bottom nav */
    .bottom{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(7,31,37,0), rgba(7,31,37,.86));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .bottom-inner{
      max-width: 980px;
      margin: 0 auto;
      border-radius: 22px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 30px 70px rgba(0,0,0,.45);
      padding: 10px 10px;
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tab{
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      gap: 6px;
      padding: 10px 8px;
      border-radius: 18px;
      cursor:pointer;
      color: rgba(233,244,246,.75);
      font-weight: 900;
      user-select:none;
    }
    .tab.active{
      background: rgba(255,255,255,.06);
      color: var(--t0);
      border: 1px solid rgba(38,208,216,.20);
    }
    .tab .i{
      width: 34px;
      height: 24px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.08);
      font-size: 13px;
    }
    .tab .l{ font-size: 12px; }

    /* Toast */
    .toast{
      position: fixed;
      left: 50%;
      bottom: 110px;
      transform: translateX(-50%);
      background: rgba(10,35,41,.92);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--t0);
      padding: 10px 12px;
      border-radius: 999px;
      box-shadow: 0 24px 55px rgba(0,0,0,.45);
      display:none;
      z-index: 80;
      font-weight: 900;
      gap: 10px;
      align-items:center;
      white-space: nowrap;
      max-width: calc(100vw - 24px);
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .toast.show{ display:inline-flex; }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      z-index: 90;
      display:none;
    }
    .modal.open{ display:block; }
    .modal .backdrop{
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .modal .sheet{
      position:absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: min(920px, calc(100vw - 18px));
      max-height: 80vh;
      overflow:auto;
      border-radius: 26px 26px 0 0;
      background: rgba(10,35,41,.92);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 30px 90px rgba(0,0,0,.6);
      padding: 16px;
    }
    .sheet h2{
      margin: 6px 0 10px;
      font-size: 18px;
      font-weight: 1000;
      letter-spacing: -.2px;
    }
    .sheet p{
      margin: 0 0 12px;
      color: var(--t1);
      font-weight: 700;
      line-height: 1.35;
    }
    .sheet .row{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .sheet .row .btn{
      flex: 1;
      min-width: 160px;
      justify-content:center;
      display:inline-flex;
      align-items:center;
      gap: 10px;
    }

    /* Small */
    @media (max-width: 420px){
      .teams{ font-size: 28px; }
      .card{ width: 320px; }
      .h{ font-size: 30px; }
    }
  </style>
</head>

<body>
  <div class="safe">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="logo"><span>RD</span></div>
          <div class="brand-text">
            <div class="brand-title">Radar PRO</div>
            <div class="brand-sub">
              <span class="dot" id="onlineDot"></span>
              <span id="statusText">Online</span>
              <span id="versionText" style="opacity:.75;font-weight:900;"></span>
              <span id="checkText" style="opacity:.75;font-weight:900;"></span>
            </div>
          </div>
        </div>

        <div class="spacer"></div>

        <button class="btn btn-ghost" id="btnCadastro">CADASTRE-SE</button>
        <button class="btn btn-primary" id="btnEntrar">ENTRAR</button>
        <button class="kebab" id="btnMenu" aria-label="Menu">⋯</button>

        <div class="menu" id="menu">
          <button id="mFavoritos"><span class="ico">★</span> Favoritos</button>
          <button id="mHistorico"><span class="ico">⏱</span> Histórico</button>
          <div class="sep"></div>
          <button id="mConfig"><span class="ico">⚙</span> Configurações</button>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="sports" id="sportsBar">
        <div class="sport active" data-sport="all">
          <div class="badge" id="countAll">0</div>
          <div class="lab">Tudo</div>
        </div>
        <div class="sport" data-sport="football">
          <div class="badge" id="countFootball">0</div>
          <div class="lab">Futebol</div>
        </div>
        <div class="sport" data-sport="tennis">
          <div class="badge" id="countTennis">0</div>

        <div class="sport" data-sport="basketball">

        <div class="sport" data-sport="volley">
          <div class="badge" id="countVolley">0</div>

      </div>

      <div class="cta">
        <div class="pill">
          <span style="opacity:.9">💎</span>
          <span class="text">Entre pro PRO</span>
          <span class="tag">NOVO</span>
        </div>
        <div class="pill" style="max-width: 220px; flex:0 0 auto;">
          <span style="opacity:.9">📷</span>
          <span class="text">Instagram</span>
        </div>
      </div>

      <section class="section">
        <div class="highlight-row" id="highlights"></div>
      </section>

      <section class="section">
        <div class="h">Populares</div>
        <div class="subtabs" id="popularTabs">
          <div class="chip active" data-pop="improved">🔥 Odds Melhoradas</div>
          <div class="chip" data-pop="leagues">⚽ Ligas principais</div>
          <div class="chip" data-pop="europe">🌍 Europa</div>
        </div>
      </section>

      <section class="section">
        <div class="list-head">
          <div class="list-title">Jogos ao vivo</div>
          <div class="list-count" id="liveCount">0</div>
        </div>
        <div id="liveLeagues"></div>
      </section>
    </main>

    <nav class="bottom">
      <div class="bottom-inner">
        <div class="tab active" data-page="home">
          <div class="i">⌂</div>
          <div class="l">Início</div>
        </div>
        <div class="tab" data-page="live">
          <div class="i">⟮⟯</div>
          <div class="l">Ao vivo</div>
        </div>
        <div class="tab" data-page="games">
          <div class="i">📅</div>
          <div class="l">Jogos</div>
        </div>
        <div class="tab" data-page="bets">
          <div class="i">🧾</div>
          <div class="l">Apostas</div>
        </div>
      </div>
    </nav>

    <div class="toast" id="toast">✔</div>

    <div class="modal" id="modal">
      <div class="backdrop"></div>
      <div class="sheet">
        <h2 id="modalTitle">Detalhes</h2>
        <p id="modalText"></p>
        <div class="row">
          <button class="btn btn-ghost" id="modalClose">Fechar</button>
          <button class="btn btn-primary" id="modalAction">Abrir</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ✅ Objetivo desta versão:
     * - NÃO mexer no layout
     * - Ajustar consumo do jogos.json para:
     *   1) não “travar” jogo velho como ao vivo
     *   2) corrigir minutos (usar kickoffTs + elapsed do JSON, e não inventar hora)
     *   3) lidar com cache do GitHub Pages (cacheBust)
     *   4) mostrar odds/probabilidades quando existirem (p1/px/p2 e o1/ox/o2)
     */

    // ====== CONFIG ======
    const APP_VERSION = "v2.4.1";
    const DATA_URL_BASE = "./jogos.json";          // mesmo nível do index.html
    const FETCH_TIMEOUT_MS = 15000;

    // Janela de “jogo de ontem”: mantém no máximo X horas no passado.
    // Se o JSON vier com jogos antigos, a UI ignora.
    const KEEP_PAST_HOURS_UI = 6;
    // Mantém também alguns jogos do futuro (pré-jogo) se vierem marcados como live por bug:
    const KEEP_FUTURE_HOURS_UI = 18;

    // Status considerados "ao vivo" (varia entre APIs)
    const LIVE_STATUSES = new Set(["1H","2H","HT","ET","P","LIVE","IN_PLAY","INP","INT"]);

    // ====== HELPERS ======
    const $ = (sel, el=document) => el.querySelector(sel);
    const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];

    function pad2(n){ return String(n).padStart(2,"0"); }

    function nowMs(){ return Date.now(); }
    function hoursToMs(h){ return h * 60 * 60 * 1000; }

    function formatClock(elapsed){
      // elapsed pode vir como number, string, null
      if (elapsed === null || elapsed === undefined) return "--:--";
      const n = Number(elapsed);
      if (!Number.isFinite(n)) return "--:--";
      if (n <= 0) return "00:00";
      return `${n}:00`;
    }

    function formatScore(g){
      const h = (g.scoreHome ?? g.goalsHome ?? g.homeGoals ?? g.home_score ?? 0);
      const a = (g.scoreAway ?? g.goalsAway ?? g.awayGoals ?? g.away_score ?? 0);
      return `${h} - ${a}`;
    }

    function safeText(s){
      if (s === null || s === undefined) return "";
      return String(s);
    }

    function toast(msg){
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._tm);
      toast._tm = setTimeout(()=>t.classList.remove("show"), 2000);
    }

    function openModal(title, text, actionText="Abrir", actionFn=null){
      $("#modalTitle").textContent = title;
      $("#modalText").textContent = text || "";
      const btn = $("#modalAction");
      btn.textContent = actionText;
      btn.onclick = () => {
        if (typeof actionFn === "function") actionFn();
        closeModal();
      };
      $("#modal").classList.add("open");
    }
    function closeModal(){ $("#modal").classList.remove("open"); }

    $("#modalClose").addEventListener("click", closeModal);
    $("#modal .backdrop").addEventListener("click", closeModal);

    // Menu (3 pontinhos)
    const menu = $("#menu");
    $("#btnMenu").addEventListener("click", (e)=>{
      e.stopPropagation();
      menu.classList.toggle("open");
    });
    document.addEventListener("click", ()=> menu.classList.remove("open"));

    $("#mFavoritos").addEventListener("click", ()=> { menu.classList.remove("open"); toast("Favoritos"); });
    $("#mHistorico").addEventListener("click", ()=> { menu.classList.remove("open"); toast("Histórico"); });
    $("#mConfig").addEventListener("click", ()=> { menu.classList.remove("open"); toast("Configurações"); });

    // Tabs inferior
    $$(".tab").forEach(t=>{
      t.addEventListener("click", ()=>{
        $$(".tab").forEach(x=>x.classList.remove("active"));
        t.classList.add("active");
        const page = t.dataset.page;
        if (page === "live") toast("Ao vivo");
        if (page === "games") toast("Jogos");
        if (page === "bets") toast("Apostas");
        if (page === "home") toast("Início");
      });
    });

    // Tabs de esportes
    $("#sportsBar").addEventListener("click", (e)=>{
      const el = e.target.closest(".sport");
      if (!el) return;
      $$(".sport").forEach(x=>x.classList.remove("active"));
      el.classList.add("active");
      currentSport = el.dataset.sport;
      renderAll();
    });

    // Tabs populares (não muda dados, só UI)
    $("#popularTabs").addEventListener("click", (e)=>{
      const el = e.target.closest(".chip");
      if (!el) return;
      $$(".chip").forEach(x=>x.classList.remove("active"));
      el.classList.add("active");
      toast(el.textContent.trim());
    });

    // ====== DADOS ======
    let currentSport = "all";
    let allGames = [];
    let lastPayload = null;

    function inferIsLive(g){
      // Preferir campo isLive do JSON
      if (typeof g.isLive === "boolean") return g.isLive;

      // Se tiver status, considerar live se estiver na lista
      const st = (g.status || "").toUpperCase().trim();
      if (LIVE_STATUSES.has(st)) return true;

      // Se elapsed > 0 e não for FT/NS
      const el = Number(g.elapsed);
      if (Number.isFinite(el) && el > 0){
        if (st === "FT" || st === "AET" || st === "PEN" || st === "CANC" || st === "PST") return false;
        return true;
      }
      return false;
    }

    function kickoffMs(g){
      // Prioridade: kickoffTs vindo pronto
      if (Number.isFinite(Number(g.kickoffTs))) return Number(g.kickoffTs);

      // Fallback: date + time
      const d = g.date; // YYYY-MM-DD
      const t = g.time; // HH:MM
      if (d && t){
        const iso = `${d}T${t}:00`;
        const ms = Date.parse(iso);
        if (Number.isFinite(ms)) return ms;
      }
      if (d){
        const ms = Date.parse(`${d}T00:00:00`);
        if (Number.isFinite(ms)) return ms;
      }
      return null;
    }

    function normalizeGame(g){
      const k = kickoffMs(g);
      const st = (g.status || "").toUpperCase().trim();
      const isLive = inferIsLive(g);

      // elapsed: se for live e elapsed vier errado (ex: 154) mantém, UI só exibe "n:00"
      const elapsed = (g.elapsed === null || g.elapsed === undefined) ? null : Number(g.elapsed);
      const elapsedOk = Number.isFinite(elapsed) ? elapsed : null;

      // odds/prob: o1/ox/o2 (odds); p1/px/p2 (probabilidades)
      const o1 = (g.o1 ?? g.odds1 ?? g.homeOdd ?? null);
      const ox = (g.ox ?? g.oddsX ?? g.drawOdd ?? null);
      const o2 = (g.o2 ?? g.odds2 ?? g.awayOdd ?? null);

      const p1 = (g.p1 ?? g.prob1 ?? null);
      const px = (g.px ?? g.probX ?? null);
      const p2 = (g.p2 ?? g.prob2 ?? null);

      return {
        ...g,
        status: st,
        kickoffTs: k,
        isLive,
        elapsed: elapsedOk,
        o1: o1 ?? null,
        ox: ox ?? null,
        o2: o2 ?? null,
        p1: p1 ?? null,
        px: px ?? null,
        p2: p2 ?? null,
      };
    }

    function withinTimeWindow(g){
      const k = g.kickoffTs;
      if (!Number.isFinite(k)) return true; // se não dá pra avaliar, não corta

      const now = nowMs();
      const minPast = now - hoursToMs(KEEP_PAST_HOURS_UI);
      const maxFuture = now + hoursToMs(KEEP_FUTURE_HOURS_UI);

      // Se é FT e já passou muito, joga fora
      if ((g.status === "FT" || g.status === "AET" || g.status === "PEN") && k < minPast) return false;

      // Se não é live e é muito antigo, joga fora também
      if (!g.isLive && k < minPast) return false;

      // Se bugou como live muito no futuro, corta
      if (g.isLive && k > maxFuture) return false;

      return true;
    }

    function sportOf(g){
      // Seu JSON é de futebol (API-Football).
      // Mantemos estrutura para futuro: se tiver "sport" no JSON, respeita.
      const s = (g.sport || "football").toLowerCase();
      if (s.includes("tennis")) return "tennis";
      if (s.includes("basket")) return "basketball";
      if (s.includes("volley")) return "volley";
      return "football";
    }

    async function fetchWithTimeout(url, ms){
      const ctrl = new AbortController();
      const t = setTimeout(()=>ctrl.abort(), ms);
      try{
        const res = await fetch(url, { cache: "no-store", signal: ctrl.signal });
        return res;
      } finally {
        clearTimeout(t);
      }
    }

    async function loadData(){
      try{
        $("#statusText").textContent = "Carregando...";
        $("#onlineDot").style.background = "#ffb020";

        // Primeiro busca o JSON "puro" para pegar o cacheBust (se existir)
        // Depois refaz com cacheBust para evitar Pages cache antigo.
        let url = DATA_URL_BASE + `?t=${Date.now()}`;
        const res = await fetchWithTimeout(url, FETCH_TIMEOUT_MS);
        if (!res.ok) throw new Error("HTTP " + res.status);

        const payload = await res.json();
        lastPayload = payload;

        // Se tiver cacheBust, busca de novo com ele (garantia extra)
        if (payload && payload.cacheBust){
          const url2 = DATA_URL_BASE + `?cb=${encodeURIComponent(payload.cacheBust)}`;
          const res2 = await fetchWithTimeout(url2, FETCH_TIMEOUT_MS);
          if (res2.ok){
            const payload2 = await res2.json();
            lastPayload = payload2;
          }
        }

        const games = Array.isArray(lastPayload?.games) ? lastPayload.games : [];
        allGames = games.map(normalizeGame).filter(withinTimeWindow);

        updateHeaderInfo();
        renderAll();

        $("#statusText").textContent = "Online";
        $("#onlineDot").style.background = "#35d07f";
      }catch(err){
        console.error(err);
        $("#statusText").textContent = "Offline";
        $("#onlineDot").style.background = "#ff4b4b";
        toast("Falha ao carregar jogos");
      }
    }

    function updateHeaderInfo(){
      $("#versionText").textContent = APP_VERSION ? (" " + APP_VERSION) : "";
      const upd = lastPayload?.updatedAt ? String(lastPayload.updatedAt) : "";
      // Mostra “Checagem: HH:MM” baseado em updatedAt se possível
      let check = "";
      if (upd){
        // Se vier "15/02/2026, 12:21:56" ou parecido, pega HH:MM
        const m = upd.match(/(\d{1,2}):(\d{2})/);
        if (m) check = ` • Checagem: ${pad2(m[1])}:${m[2]}`;
      }
      $("#checkText").textContent = check;
    }

    // ====== RENDER ======
    function filteredGames(){
      const g = allGames;
      if (currentSport === "all") return g;
      return g.filter(x => sportOf(x) === currentSport);
    }

    function liveGames(){
      return filteredGames().filter(g => g.isLive);
    }

    function updateCounts(){
      const total = allGames.length;
      const football = allGames.filter(g=>sportOf(g)==="football").length;
      const tennis = allGames.filter(g=>sportOf(g)==="tennis").length;
      const basket = allGames.filter(g=>sportOf(g)==="basketball").length;
      const volley = allGames.filter(g=>sportOf(g)==="volley").length;

      $("#countAll").textContent = total;
      $("#countFootball").textContent = football;
      $("#countTennis").textContent = tennis;
      $("#countBasket").textContent = basket;
      $("#countVolley").textContent = volley;

      $("#liveCount").textContent = liveGames().length;
    }

    function oddCell(k, v){
      if (v === null || v === undefined) return `<div class="odd2"><span class="k">${k}</span> <span class="dash">—</span></div>`;
      const n = Number(v);
      if (!Number.isFinite(n)) return `<div class="odd2"><span class="k">${k}</span> <span class="dash">—</span></div>`;
      return `<div class="odd2"><span class="k">${k}</span> <span class="v">${n.toFixed(2)}</span></div>`;
    }

    function highlightOddCell(k, v){
      if (v === null || v === undefined) return `<div class="odd"><span class="k">${k}</span> <span class="dash" style="color:rgba(255,255,255,.35)">—</span></div>`;
      const n = Number(v);
      if (!Number.isFinite(n)) return `<div class="odd"><span class="k">${k}</span> <span class="dash" style="color:rgba(255,255,255,.35)">—</span></div>`;
      return `<div class="odd"><span class="k">${k}</span> <span class="v">${n.toFixed(2)}</span></div>`;
    }

    function pickOddsForUI(g){
      // Preferir odds (o1/ox/o2). Se não existir, tentar usar probabilidades (p1/px/p2) convertidas em “odd justa”.
      let o1 = g.o1, ox = g.ox, o2 = g.o2;

      const hasOdds = [o1,ox,o2].some(v => Number.isFinite(Number(v)));
      if (hasOdds) return { o1, ox, o2 };

      const p1 = Number(g.p1), px = Number(g.px), p2 = Number(g.p2);
      const hasProb = [p1,px,p2].some(v => Number.isFinite(v) && v > 0);
      if (!hasProb) return { o1:null, ox:null, o2:null };

      // Se prob vier 0-1 ou 0-100, normaliza pra 0-1
      const norm = (p)=> (p>1 ? p/100 : p);
      const P1 = norm(p1), PX = norm(px), P2 = norm(p2);
      const toOdd = (p)=> (p>0 ? (1/p) : null);

      return {
        o1: Number.isFinite(P1) ? toOdd(P1) : null,
        ox: Number.isFinite(PX) ? toOdd(PX) : null,
        o2: Number.isFinite(P2) ? toOdd(P2) : null
      };
    }

    function renderHighlights(){
      const el = $("#highlights");
      const lives = liveGames()
        .slice()
        .sort((a,b)=>{
          const ea = Number(a.elapsed)||0, eb = Number(b.elapsed)||0;
          return eb - ea;
        })
        .slice(0, 8);

      if (lives.length === 0){
        el.innerHTML = `
          <div class="card" style="width: 100%;">
            <div class="badge-live"><span class="dot-live"></span> Destaques</div>
            <div class="teams" style="margin-top:14px;">Sem destaques agora</div>
            <div class="meta"><span style="color:var(--t1);font-weight:800;">Atualize mais tarde.</span><span class="scorepill">—</span></div>
            <div class="oddsbar" style="margin-top:14px;">
              <div class="odd"><span class="k">1</span> <span class="v">—</span></div>
              <div class="odd"><span class="k">X</span> <span class="v">—</span></div>
              <div class="odd"><span class="k">2</span> <span class="v">—</span></div>
            </div>
          </div>
        `;
        return;
      }

      el.innerHTML = lives.map(g=>{
        const odds = pickOddsForUI(g);
        return `
          <div class="card">
            <div class="badge-live"><span class="dot-live"></span> AO VIVO</div>
            <div class="teams">${safeText(g.home)}<br>${safeText(g.away)}</div>
            <div class="meta">
              <span style="color:var(--t1)">${safeText(g.country)} • ${safeText(g.league)}</span>
              <span class="scorepill">${formatScore(g)} • ${formatClock(g.elapsed)}</span>
            </div>
            <div class="oddsbar">
              ${highlightOddCell("1", odds.o1)}
              ${highlightOddCell("X", odds.ox)}
              ${highlightOddCell("2", odds.o2)}
            </div>
          </div>
        `;
      }).join("");
    }

    function groupByLeague(games){
      // Chave: country + league
      const map = new Map();
      for (const g of games){
        const key = `${g.country}||${g.league}`;
        if (!map.has(key)) map.set(key, { country:g.country, league:g.league, items:[] });
        map.get(key).items.push(g);
      }
      // ordena por quantidade e por país/ligas
      return [...map.values()].sort((a,b)=> b.items.length - a.items.length);
    }

    function renderLiveList(){
      const root = $("#liveLeagues");
      const lives = liveGames();

      if (lives.length === 0){
        root.innerHTML = `
          <div style="padding: 28px 10px; color: rgba(233,244,246,.55); font-weight: 900; text-align:center;">
            Sem jogos ao vivo no momento.
          </div>
        `;
        return;
      }

      const leagues = groupByLeague(lives);

      root.innerHTML = leagues.map((L, idx)=>{
        const id = `lg_${idx}`;
        const flag = "🌍";
        return `
          <div class="league" data-league="${id}">
            <div class="league-head">
              <div class="flag">${flag}</div>
              <div class="league-name">${safeText(L.country)} • ${safeText(L.league)}</div>
              <div class="collapse" data-collapse="${id}">▲</div>
            </div>
            <div class="matches" id="${id}">
              ${L.items.map(g=>{
                const odds = pickOddsForUI(g);
                return `
                  <div class="match">
                    <div class="match-top">
                      <div class="teams2">
                        <div class="teamrow"><div class="ball">⚽</div><div class="teamname">${safeText(g.home)}</div></div>
                        <div class="teamrow"><div class="ball">⚽</div><div class="teamname">${safeText(g.away)}</div></div>
                      </div>
                      <div class="match-right">
                        <div class="live-pill"><span class="d"></span> AO VIVO</div>
                        <div class="match-time">${safeText(g.time || "")}</div>
                        <div class="score">${formatScore(g)} • ${formatClock(g.elapsed)}</div>
                      </div>
                    </div>

                    <div class="oddsbar2">
                      ${oddCell("1", odds.o1)}
                      ${oddCell("X", odds.ox)}
                      ${oddCell("2", odds.o2)}
                    </div>

                    <div class="match-actions">
                      <button class="btn2" data-details="${g.id}">Detalhes</button>
                      <button class="btn2 star" data-fav="${g.id}">☆ Favoritar</button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");

      // collapse
      $$(".collapse", root).forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.dataset.collapse;
          const box = document.getElementById(id);
          const isHidden = box.style.display === "none";
          box.style.display = isHidden ? "block" : "none";
          btn.textContent = isHidden ? "▲" : "▼";
        });
      });

      // actions
      root.addEventListener("click", (e)=>{
        const d = e.target.closest("[data-details]");
        if (d){
          const id = Number(d.dataset.details);
          const g = allGames.find(x=>Number(x.id)===id);
          if (!g) return;
          openModal("Detalhes do jogo", `${safeText(g.home)} x ${safeText(g.away)}\n${safeText(g.country)} • ${safeText(g.league)}\nStatus: ${safeText(g.status)} • ${formatClock(g.elapsed)}\nPlacar: ${formatScore(g)}`, "Ok", ()=>{});
          return;
        }
        const f = e.target.closest("[data-fav]");
        if (f){
          toast("Adicionado aos favoritos");
        }
      });
    }

    function renderAll(){
      updateCounts();
      renderHighlights();
      renderLiveList();
    }

    // ====== AUTO-REFRESH ======
    // Recarrega o JSON periodicamente para manter minutos “minuto a minuto”
    // (o minuto em si vem do JSON; aqui a gente só refaz fetch)
    const REFRESH_MS = 60 * 1000; // 1 minuto
    setInterval(loadData, REFRESH_MS);

    // INIT
    (function init(){
      $("#versionText").textContent = " " + APP_VERSION;
      loadData();
    })();
  </script>
</body>
</html>
