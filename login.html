<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2022" />
  <title>Radar PRO - Login</title>
  <style>
    :root{
      --bg:#0b2022;
      --card:rgba(255,255,255,.06);
      --card2:rgba(255,255,255,.08);
      --text:#e8f2f2;
      --muted:rgba(232,242,242,.65);
      --stroke:rgba(255,255,255,.12);
      --pink:#ff2d77;
      --pink2:#ff4a8f;
      --radius:22px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:radial-gradient(900px 500px at 50% 0%, rgba(255,45,119,.08), transparent 60%),
                 radial-gradient(900px 500px at 50% 100%, rgba(0,255,200,.06), transparent 60%),
                 var(--bg);
      color:var(--text);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .wrap{width:min(520px, 100%); }
    .brand{
      display:flex; gap:12px; align-items:center;
      margin:0 0 14px 0;
    }
    .logo{
      width:54px;height:54px;border-radius:18px;
      display:grid;place-items:center;
      background:linear-gradient(135deg, rgba(255,45,119,.9), rgba(255,45,119,.35));
      border:1px solid rgba(255,255,255,.18);
      font-weight:800;
      letter-spacing:.5px;
    }
    .title{display:flex;flex-direction:column;line-height:1.1}
    .title h1{margin:0;font-size:22px}
    .title small{color:var(--muted);font-size:13px;margin-top:4px}
    .card{
      background:linear-gradient(180deg, var(--card), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.22);
      backdrop-filter: blur(6px);
    }
    .tabs{
      display:flex;
      background:rgba(0,0,0,.18);
      border:1px solid var(--stroke);
      border-radius:18px;
      padding:6px;
      gap:6px;
      margin-bottom:12px;
    }
    .tab{
      flex:1;
      border:0;
      border-radius:14px;
      padding:10px 12px;
      background:transparent;
      color:var(--muted);
      font-weight:700;
    }
    .tab.active{
      background:rgba(255,45,119,.18);
      color:var(--text);
      border:1px solid rgba(255,45,119,.25);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(0,0,0,.18);
      border:1px solid var(--stroke);
      color:var(--muted);
      font-size:13px;
      margin-bottom:12px;
    }
    .msg{
      display:none;
      margin:10px 0 0 0;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.18);
      color:var(--text);
      font-size:14px;
      line-height:1.35;
      white-space:pre-line;
    }
    .msg.warn{border-color:rgba(255,170,0,.35); background:rgba(255,170,0,.08)}
    .msg.ok{border-color:rgba(0,255,180,.28); background:rgba(0,255,180,.06)}
    form{margin-top:6px}
    label{display:block; font-size:13px; color:var(--muted); margin:10px 0 6px}
    input{
      width:100%;
      padding:14px 14px;
      border-radius:16px;
      border:1px solid var(--stroke);
      background:rgba(0,0,0,.20);
      color:var(--text);
      outline:none;
      font-size:15px;
    }
    input:focus{border-color:rgba(255,45,119,.35)}
    .row{
      display:flex;
      gap:10px;
      margin-top:14px;
    }
    .btn{
      flex:1;
      border:0;
      border-radius:16px;
      padding:13px 14px;
      font-weight:800;
      cursor:pointer;
      background:rgba(255,255,255,.06);
      color:var(--text);
      border:1px solid var(--stroke);
    }
    .btn.primary{
      background:linear-gradient(135deg, var(--pink), var(--pink2));
      border:0;
      color:white;
    }
    .btn:disabled{opacity:.6; cursor:not-allowed}
    .links{
      display:flex;
      justify-content:space-between;
      margin-top:12px;
      gap:10px;
      flex-wrap:wrap;
    }
    a{color:rgba(232,242,242,.75); text-decoration:none; font-size:13px}
    a:hover{color:white; text-decoration:underline}
    .extra{display:none;margin-top:8px}
    .note{
      margin-top:12px;
      padding:12px;
      border-radius:16px;
      border:1px solid rgba(255,200,0,.25);
      background:rgba(255,200,0,.06);
      color:rgba(255,255,255,.88);
      font-size:13px;
      line-height:1.35;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">RD</div>
      <div class="title">
        <h1>Radar PRO</h1>
        <small>Login • Conta • PRO</small>
      </div>
    </div>

    <div class="card">
      <div class="tabs">
        <button id="tabLogin" class="tab active" type="button">Entrar</button>
        <button id="tabSignup" class="tab" type="button">Criar conta</button>
      </div>

      <div id="envPill" class="pill">Carregando…</div>

      <form id="form">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" />

        <label for="password">Senha</label>
        <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" />

        <div id="signupExtra" class="extra">
          <label for="password2">Confirmar senha</label>
          <input id="password2" type="password" placeholder="Repita a senha" autocomplete="new-password" />
        </div>

        <div class="row">
          <button id="btnSubmit" class="btn primary" type="submit">Entrar</button>
          <button id="btnBack" class="btn" type="button">Voltar</button>
        </div>

        <div id="msg" class="msg"></div>

        <div class="links">
          <a id="forgot" href="javascript:void(0)">Esqueci minha senha</a>
          <a href="./">Ir para o Radar</a>
        </div>

        <div class="note">
          Dica: no começo, você pode desligar confirmação por e-mail no Supabase pra testar mais rápido.
        </div>
      </form>
    </div>
  </div>

  <!-- IMPORTANTÍSSIMO: auth.js precisa ser módulo -->
  <script type="module" src="./auth.js"></script>
</body>
</html>
