<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b2022" />
  <title>Radar PRO • Entrar</title>
  <link rel="icon" href="icon-192.png" />
  <style>
    :root{
      --bg:#07191b;
      --bg2:#0b2022;
      --card: rgba(255,255,255,0.06);
      --card2: rgba(255,255,255,0.09);
      --line: rgba(255,255,255,0.10);
      --txt: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.62);
      --accent:#ff2d7a;
      --ok:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --shadow: 0 14px 42px rgba(0,0,0,.45);
      --r: 18px;
      --r2: 22px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: var(--font);
      color:var(--txt);
      background: radial-gradient(1200px 800px at 20% 10%, rgba(255,45,122,0.16), transparent 55%),
                  radial-gradient(900px 650px at 85% 20%, rgba(34,197,94,0.10), transparent 60%),
                  linear-gradient(180deg, var(--bg), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:18px;
    }
    .wrap{ width:min(470px, 100%); }
    .top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
    .logo{
      width:44px;height:44px;border-radius:14px;
      background: linear-gradient(135deg, rgba(255,45,122,.85), rgba(99,102,241,.6));
      display:grid; place-items:center;
      box-shadow: var(--shadow);
      flex:0 0 auto;
    }
    .logo span{font-weight:800; letter-spacing:0.5px}
    .brand .title{font-size:18px; font-weight:800; line-height:1.1}
    .brand .sub{font-size:12px;color:var(--muted); margin-top:2px}
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.04));
      border:1px solid var(--line);
      border-radius: var(--r2);
      box-shadow: var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(12px);
    }
    .seg{
      display:flex; gap:8px; padding:10px;
      border-bottom:1px solid var(--line);
      background: rgba(0,0,0,0.12);
    }
    .seg button{
      flex:1;
      border:1px solid var(--line);
      border-radius: 14px;
      padding:10px 12px;
      background: rgba(255,255,255,0.04);
      color:var(--txt);
      font-weight:700;
      cursor:pointer;
      transition: .15s transform, .15s background, .15s border;
    }
    .seg button.active{
      background: rgba(255,45,122,0.16);
      border-color: rgba(255,45,122,0.35);
    }
    .seg button:active{transform: scale(0.99)}
    .content{padding:14px 14px 10px}
    label{display:block; font-size:12px; color:var(--muted); margin:10px 0 6px}
    input{
      width:100%;
      padding:12px 12px;
      border-radius: 14px;
      border:1px solid var(--line);
      background: rgba(0,0,0,0.18);
      color: var(--txt);
      outline:none;
    }
    input:focus{border-color: rgba(255,45,122,0.5)}
    .actions{ display:flex; gap:10px; margin-top:12px; }
    .btn{
      border:1px solid var(--line);
      border-radius: 16px;
      padding:12px 12px;
      background: rgba(255,255,255,0.05);
      color:var(--txt);
      font-weight:800;
      cursor:pointer;
      width:100%;
      transition: .15s transform, .15s background, .15s border;
    }
    .btn.primary{
      background: linear-gradient(135deg, rgba(255,45,122,0.95), rgba(255,45,122,0.65));
      border-color: rgba(255,45,122,0.35);
    }
    .btn:active{transform: scale(0.99)}
    .btn:disabled{opacity:.6; cursor:not-allowed}
    .footer{
      padding:0 14px 14px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .link{ color: rgba(255,255,255,0.75); font-size:12px; text-decoration:none; }
    .link:hover{color:#fff; text-decoration:underline}
    .msg{
      margin-top:10px;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius: 14px;
      font-size:12px;
      background: rgba(0,0,0,0.14);
      display:none;
      white-space:pre-wrap;
    }
    .msg.ok{border-color: rgba(34,197,94,0.35); background: rgba(34,197,94,0.10)}
    .msg.warn{border-color: rgba(245,158,11,0.35); background: rgba(245,158,11,0.10)}
    .msg.bad{border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.10)}
    .hint{ margin-top:10px; font-size:12px; color: var(--muted); line-height:1.35; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 10px;
      border:1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.04);
      font-size:12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="logo" aria-hidden="true"><span>RD</span></div>
      <div class="brand">
        <div class="title">Radar PRO</div>
        <div class="sub">Login • Conta • PRO</div>
      </div>
    </div>

    <div class="card">
      <div class="seg">
        <button id="tabLogin" class="active" type="button">Entrar</button>
        <button id="tabSignup" type="button">Criar conta</button>
      </div>

      <div class="content">
        <div class="pill" id="envPill">Conectando ao Supabase…</div>

        <form id="form" autocomplete="on">
          <label for="email">E-mail</label>
          <input id="email" type="email" inputmode="email" placeholder="seuemail@exemplo.com" required />

          <label for="password">Senha</label>
          <input id="password" type="password" placeholder="Sua senha" required />

          <div id="signupExtra" style="display:none;">
            <label for="password2">Confirmar senha</label>
            <input id="password2" type="password" placeholder="Repita a senha" />
          </div>

          <div class="actions">
            <button id="btnSubmit" class="btn primary" type="submit">Entrar</button>
            <button id="btnBack" class="btn" type="button">Voltar</button>
          </div>

          <div id="msg" class="msg"></div>

          <div class="hint">
            Dica: no começo, você pode <b>desligar confirmação por e-mail</b> no Supabase pra testar mais rápido.
          </div>
        </form>
      </div>

      <div class="footer">
        <a class="link" href="#" id="forgot">Esqueci minha senha</a>
        
      </div>
    </div>
  </div>

  <script type="module" src="./auth.js"></script>
</body>
</html>
